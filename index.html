spacing:-1.7px;font-weight:760}h2{font-size:22px;line-height:1.2;letter-spacing:-.4px;margin:0}h3{font-size:16px;margin:0}.lead{font-size:16px;color:var(--sub);margin:14px auto 28px;max-width:550px}.entry{background:white;border:1px solid #cdd8e3;border-radius:18px;padding:12px;text-align:left;box-shadow:var(--shadow)}textarea,input,select{width:100%;min-width:0;color:var(--ink);background:white;border:1px solid #ccd6e1;border-radius:10px;padding:10px 12px;outline:0}textarea:focus,input:focus,select:focus,button:focus-visible{outline:3px solid #8fbbd5aa;outline-offset:1px}textarea{resize:vertical;min-height:70px}.entry textarea{border:0;outline:0;resize:vertical;min-height:100px;padding:12px 12px 5px;box-shadow:none;font-size:17px}.entry-bottom{display:flex;justify-content:space-between;align-items:center;padding:4px 3px 1px;gap:12px}.footnote,.muted{color:var(--sub);font-size:13px}.quick-links{display:flex;justify-content:center;gap:15px;align-items:center;margin:26px auto 0;flex-wrap:wrap}.quick-links button{font-weight:650}.footer{color:#8592a0;font-size:12px;text-align:center;padding:18px;border-top:1px solid #e6eaf0}.workspace{max-width:790px;margin:0 auto}.workspace-head{display:flex;justify-content:space-between;align-items:start;gap:15px;margin-bottom:22px}.topic{font-size:clamp(23px,3.8vw,32px);letter-spacing:-.7px;font-weight:750;line-height:1.27;margin:4px 0 4px;overflow-wrap:anywhere}.status{font-size:12px;color:#537465;background:#eef6f2;border-radius:100px;padding:6px 11px;display:inline-block;font-weight:750}.thread{display:flex;flex-direction:column;gap:14px;padding:20px 0 25px;min-height:100px}.bubble{max-width:88%;padding:15px 17px;white-space:pre-wrap;overflow-wrap:anywhere;font-size:15px;line-height:1.58}.bubble.you{align-self:flex-end;background:var(--navy);color:white;border-radius:16px 16px 4px 16px}.bubble.guide{align-self:flex-start;background:white;border:1px solid #dde4ec;border-radius:16px 16px 16px 4px;box-shadow:0 3px 12px #00000005}.bubble .who{font-size:11px;letter-spacing:.6px;text-transform:uppercase;margin-bottom:6px;color:#5b788f;font-weight:850}.bubble.you .who{color:#adc5d6}.composer{background:white;border:1px solid #cad6e1;border-radius:16px;padding:10px;box-shadow:var(--shadow)}.composer textarea{border:0;box-shadow:none!important;outline:none!important;min-height:72px;padding:10px}.composer-bottom{display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap}.suggestion{background:#e9f1f8;border:1px solid #d4e2ee;color:#315878;border-radius:100px;padding:8px 12px;font-size:12px;font-weight:700}.ideas{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0 20px}.panel{background:#fff;border:1px solid var(--edge);border-radius:18px;box-shadow:var(--shadow);padding:22px;margin:18px 0}.panel p{color:var(--sub);margin:6px 0 15px}.line{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.stack{display:grid;gap:12px}.text-label{display:block;font-size:13px;font-weight:750;margin-bottom:6px;color:#41566d}.divider{height:1px;background:var(--edge);margin:18px 0}.item{display:flex;align-items:start;gap:10px;justify-content:space-between;padding:10px 12px;background:#f5f7f9;border:1px solid #e4eaf0;border-radius:10px;margin-top:8px}.item span{overflow-wrap:anywhere;flex:1}.item .quiet{padding:0 4px;font-size:19px}.two{display:grid;grid-template-columns:1fr 1fr;gap:16px}.scoregrid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}.scoregrid label{font-size:12px;color:var(--sub)}.scoregrid select{margin-top:4px;padding:8px;font-size:13px}.option{border:1px solid var(--edge);border-radius:13px;padding:16px;margin-top:12px}.option h3{font-size:17px;margin-bottom:8px}.option textarea{min-height:66px}.small{font-size:12px;color:var(--sub)}.good{color:#14694b}.warning{color:#93672d}.drawer{position:fixed;z-index:20;inset:0;display:flex;justify-content:flex-end}.scrim{position:absolute;inset:0;background:#1022356e;border:0;width:100%}.drawer-body{position:relative;background:#fff;width:min(100%,495px);height:100%;overflow-y:auto;box-shadow:-12px 0 40px #0e26353a;padding:25px}.drawer-head{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:22px}.tool-switches{display:flex;gap:7px;flex-wrap:wrap;margin:12px 0 20px}.tool-switches button{font-size:13px;padding:9px 10px}.tool-switches button.active{background:var(--navy);color:#fff;border-color:var(--navy)}.overlay-empty{text-align:center;color:var(--sub);padding:25px 10px}.project-list{display:grid;gap:9px}.project-link{display:flex;justify-content:space-between;align-items:center;text-align:left;gap:12px;border:1px solid var(--edge);background:#fff;border-radius:12px;padding:13px;width:100%}.project-link:hover{border-color:#a4b9cd;background:#f5f8fb}.project-link strong{display:block;overflow-wrap:anywhere}.project-link small{color:var(--sub)}.toast{position:fixed;z-index:30;bottom:20px;left:50%;transform:translateX(-50%);background:#243c53;color:white;padding:10px 16px;border-radius:10px;max-width:90vw;font-size:13px}.helper{border-left:3px solid #9fbfd4;background:#f0f6f9;padding:12px 14px;border-radius:8px;color:#426078;font-size:13px}.check{accent-color:#2d7759;width:19px;height:19px;flex:none}.subtlelink{border:0;background:transparent;text-decoration:underline;color:var(--navy);padding:0;font-size:13px}.hide-on-mobile{display:inline}@media(max-width:640px){.top{height:68px;padding:0 13px}.brand-title{font-size:14px}.brand-by{font-size:10px}.nav{gap:0}.quiet{padding:8px}.nav .hide-on-mobile{display:none}main{padding:25px 15px 55px}.start{margin:10vh auto 0}.lead{margin-bottom:24px}.entry textarea{min-height:112px}.bubble{max-width:96%}.two{grid-template-columns:1fr}.scoregrid{grid-template-columns:repeat(2,minmax(0,1fr))}.drawer-body{width:min(100%,480px);padding:17px}.workspace-head{align-items:center}.workspace-head .secondary{padding:8px 9px}.composer-bottom{gap:8px}.footer{font-size:11px}}@media(prefers-reduced-motion:no-preference){.panel,.entry{transition:box-shadow .2s}}@media(prefers-color-scheme:dark){:root{color-scheme:light}}

.why-row{display:flex;align-items:flex-start;gap:10px;border:1px solid var(--edge);border-radius:12px;padding:12px;margin:9px 0;background:#fbfcfe}

<body>
<div class="app">
  <header class="top">
    <div class="brand"><div class="mark" aria-hidden="true">◇</div><div><div class="brand-title">Personal Think Tank</div><div class="brand-by">A DONCO-BAYCITY App</div></div></div>
    <nav class="nav" aria-label="Main navigation"><button class="quiet" id="homeBtn" type="button">⌂ <span class="hide-on-mobile">Home</span></button><button class="quiet" id="problemsBtn" type="button">◷ <span class="hide-on-mobile">My problems</span></button><button class="quiet" id="toolsBtn" type="button">☷ <span class="hide-on-mobile">More tools</span></button></nav>
  </header>
  <main id="appMain"></main>
  <footer class="footer">Personal Think Tank · Think clearly. Decide confidently. · DONCO-BAYCITY</footer>
</div>
<div id="drawer" class="drawer hidden" aria-hidden="true"><button class="scrim" type="button" id="drawerScrim" aria-label="Close panel"></button><aside id="drawerBody" class="drawer-body" role="dialog" aria-modal="true" aria-label="Panel"><div id="drawerContent"></div></aside></div>
<div id="toast" class="toast hidden" role="status"></div>
<input type="file" id="backupFile" accept="application/json,.json" class="hidden" aria-label="Import backup">
<script>
'use strict';
(()=>{
const STORAGE='donco.personal-think-tank.simple.v4';
const PREVIOUS_STORAGE='donco.personal-think-tank.simple.v3';
const OLD_STORAGE='donco.personal-think-tank.v1';
const safeStore={
  fallback:new Map(),
  getItem(k){try{return window.localStorage.getItem(k)}catch{return this.fallback.get(k)??null}},
  setItem(k,v){this.fallback.set(k,String(v));try{window.localStorage.setItem(k,String(v))}catch{}},
};
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const id=()=>typeof crypto!=='undefined'&&crypto.randomUUID?crypto.randomUUID():'p'+Date.now()+'_'+Math.random().toString(36).slice(2,9);
const time=()=>new Date().toISOString();
const defaultCriteria=()=>[{id:id(),name:'Benefit',weight:3},{id:id(),name:'Affordability',weight:3},{id:id(),name:'Low risk',weight:3},{id:id(),name:'Easy to carry out',weight:3}];
function openingQuestion(problem){
  const t=String(problem||'').toLowerCase();
  if(/repair|car|vehicle|engine|machine|broken|stalled|fix/.test(t))return 'I can help you reason through this. First, what matters most here: safety, reliability, cost, or getting it working quickly? What outcome do you need?';
  if(/buy|sell|house|property|business|invest|cost|price|money|budget|debt/.test(t))return 'Let’s compare this logically. What result are you trying to achieve, and what financial or time limit would make a choice unacceptable?';
  if(/job|work|career|boss|employee|team|project/.test(t))return 'I can help you think through that. First, what is the main reason you are considering work — covering bills, saving for something, or another reason? You can answer in your own words.';
  if(/health|pain|illness|medicin|symptom/.test(t))return 'We can organize what you know, but this offline demonstration cannot diagnose health problems. What outcome or question are you trying to resolve?';
  return 'I’m listening. What would a successful outcome look like for this particular problem? Be as specific as you can.';
}
const blank=(problem)=>({id:id(),title:problem.slice(0,90)||'Untitled problem',problem,goal:'',constraints:'',facts:[],assumptions:[],options:[],criteria:defaultCriteria(),tasks:[],whys:[],decision:{choice:'',reason:'',risk:'',confidence:3,reviewDate:'',reviewNotes:'',status:'Exploring'},analysis:{priority:'',unknown:'',testAction:'',risk:'',interviewComplete:false},messages:[{role:'assistant',text:openingQuestion(problem),kind:'guided'}],guideStep:0,interviewVersion:4,createdAt:time(),updatedAt:time()});
const cleanItem=x=>typeof x==='object'&&x?{id:String(x.id||id()),text:String(x.text||'').slice(0,3000)}:{id:id(),text:String(x||'').slice(0,3000)};
function migrateOld(){try{let old=JSON.parse(safeStore.getItem(OLD_STORAGE)||'null');if(!old?.projects?.length)return null;const ps=old.projects.slice(0,60).map(p=>{const v=blank(String(p.problem||p.title||''));return {...v,id:p.id||v.id,title:p.title||v.title,goal:p.goal||'',constraints:p.constraints||'',facts:(p.facts||[]).map(x=>({...cleanItem(x),source:typeof x?.source==='string'?x.source.slice(0,3000):''})),assumptions:(p.assumptions||[]).map(cleanItem),options:(p.options||[]).map(o=>({id:o.id||id(),name:String(o.name||''),pros:String(o.pros||''),cons:String(o.cons||''),scores:o.scores||{}})),criteria:p.criteria?.length?p.criteria:defaultCriteria(),tasks:(p.tasks||[]).map(t=>({id:t.id||id(),text:String(t.text||''),done:!!t.done})),messages:(p.messages||[]).map(m=>({role:m.role==='user'?'user':'assistant',text:String(m.text||'').slice(0,9000),kind:m.role==='assistant'?'legacy':'user'})),guideStep:0,createdAt:p.createdAt||v.createdAt,updatedAt:p.updatedAt||v.updatedAt}});return {version:2,projects:ps,activeId:old.activeId,aiUrl:old.aiUrl||'/api/think',useAI:false}}catch{return null}}
function load(){try{const found=JSON.parse(safeStore.getItem(STORAGE)||'null');if(found?.version===4&&Array.isArray(found.projects))return found}catch{}try{const previous=JSON.parse(safeStore.getItem(PREVIOUS_STORAGE)||'null');if(previous?.version===3&&Array.isArray(previous.projects))return {...previous,version:4}}catch{}const old=migrateOld();return old?{...old,version:4}:{version:4,projects:[],activeId:null,aiUrl:'/api/think',useAI:false}}
function normalizeProject(p){
  return {...p,whys:Array.isArray(p.whys)?p.whys.filter(x=>x&&typeof x.text==='string').slice(0,5):[],
    analysis:{priority:'',unknown:'',testAction:'',risk:'',interviewComplete:false,...(p.analysis&&typeof p.analysis==='object'?p.analysis:{})},
    interviewVersion:4,guideStep:[3,4].includes(p.interviewVersion)?Math.max(0,Math.min(9,Number(p.guideStep)||0)):0,
    messages:[3,4].includes(p.interviewVersion)?p.messages:[...(p.messages||[]),{role:'assistant',kind:'guided',text:'The questioning process has been improved. Let’s reconsider the goal using the new evidence-first interview: what would success look like?'}],
    decision:{choice:'',reason:'',risk:'',confidence:3,reviewDate:'',reviewNotes:'',status:'Exploring',...(p.decision&&typeof p.decision==='object'?p.decision:{})},
    tasks:(Array.isArray(p.tasks)?p.tasks:[]).map(t=>({...t,due:String(t.due||'').slice(0,10)}))};
}
let state=load(),view='home',drawerMode='',toolTab='facts',pending=false,toastTimer=null;
let aiReady=false,aiStatus='checking',aiError='',connectionPromise=null;
state.aiPreference=state.aiPreference||'auto';
state.projects=state.projects.map(normalizeProject);
if(!safeStore.getItem(STORAGE))try{safeStore.setItem(STORAGE,JSON.stringify(state))}catch{}
function save(){try{safeStore.setItem(STORAGE,JSON.stringify(state))}catch{toast('Your browser could not save. Export a backup to keep your work.')}}
function active(){return state.projects.find(p=>p.id===state.activeId)||null}
function touch(p){if(p)p.updatedAt=time();save()}
function toast(msg){const el=$('#toast');el.textContent=msg;el.classList.remove('hidden');clearTimeout(toastTimer);toastTimer=setTimeout(()=>el.classList.add('hidden'),4000)}
async function start(problem){
 problem=String(problem||'').trim();if(!problem)return toast('Enter a problem first.');
 if(problem.length>2000)return toast('Please use fewer than 2,000 characters.');
 if(pending)return;
 if(connectionPromise)await connectionPromise;
 const p=blank(problem);
 if(state.useAI)p.messages=[{role:'user',kind:'user',text:problem}];
 state.projects.unshift(p);state.activeId=p.id;save();view='chat';closeDrawer();render();
 if(state.useAI)await talkAI('question',p);else $('#reply')?.focus();
}
function aiStatusHtml(){
 if(state.useAI)return aiReady?'<span class="status">● AI thinking partner connected</span>':'<span class="status">● Real AI unavailable on this page</span>';
 if(aiStatus==='checking')return '<span class="status">Checking AI connection…</span>';
 if(aiReady)return '<span class="status">Offline mode selected · AI is available in More tools</span>';
 return '<span class="status">Offline guided demonstration · no AI connection</span>';
}
function isAI(){return !!state.useAI&&!!aiReady;}
function transcriptForAI(p){
 const transcript=[{role:'user',content:p.problem}];
 let first=true;
 for(const m of p.messages||[]){
  if(m.role==='assistant'&&m.kind!=='ai')continue;
  if(m.role!=='assistant'&&m.role!=='user')continue;
  if(m.role==='user'&&first&&m.text===p.problem){first=false;continue;}
  first=false;
  transcript.push({role:m.role,content:String(m.text||'').slice(0,6000)});
 }
 return transcript.slice(-35);
}
async function checkAI(){
 if(location.protocol==='file:'){aiStatus='unavailable';aiReady=false;return false;}
 try{
  const response=await fetch('/api/status',{cache:'no-store',signal:AbortSignal.timeout(4000)});
  if(!response.ok)throw Error('No AI server');
  const data=await response.json();
  aiReady=data.configured===true;aiStatus=aiReady?'connected':'setup';
 }catch{aiReady=false;aiStatus='unavailable';}
 if(state.aiPreference==='auto')state.useAI=aiReady;
 else if(state.aiPreference==='guided')state.useAI=false;
 else state.useAI=true;
 render();return aiReady;
}
async function talkAI(mode,p=active()){
 if(!p||pending)return;
 if(!aiReady){aiError='The secure AI server is not connected. For intelligent replies inside this app, follow README.md and start the local server. No answer was generated.';render();return;}
 const target=p.id;pending=true;aiError='';render();
 try{
  const ctrl=new AbortController(),timer=setTimeout(()=>ctrl.abort(),58000);
  let response;
  try{response=await fetch('/api/think',{method:'POST',headers:{'Content-Type':'application/json'},credentials:'same-origin',body:JSON.stringify({mode,messages:transcriptForAI(p)}),signal:ctrl.signal});}finally{clearTimeout(timer)}
  const result=await response.json();
  if(!response.ok||typeof result.reply!=='string'||!result.reply.trim())throw Error(result.error||'AI did not return an answer');
  const project=state.projects.find(v=>v.id===target);
  if(project){project.messages.push({role:'assistant',kind:'ai',text:result.reply.slice(0,9000)});touch(project)}
 }catch(e){aiError=e.name==='AbortError'?'The AI request timed out. You can retry.':String(e.message||'AI connection error').slice(0,350);}
 finally{pending=false;render()}
}

function render(){const p=active();const main=$('#appMain');if(view==='home'||!p){main.innerHTML=`<section class="start"><div class="eyebrow">A clearer way to think</div><h1>What problem can I help you solve?</h1><p class="lead">Describe what is on your mind. Tell me what's on your mind. With real AI connected, I'll think it through with you, challenge assumptions, and help you decide what makes sense.</p><form id="startForm" class="entry"><label class="hidden" for="problemInput">Describe your problem</label><textarea id="problemInput" name="problem" maxlength="2000" placeholder="Describe your problem..." required></textarea><div class="entry-bottom"><span class="footnote">Start with your own words.</span><button class="primary" type="submit">Start thinking →</button></div></form><div class="quick-links"><button id="recentLink" class="quiet">◷ My previous problems</button><button id="toolLink" class="quiet">☷ More tools</button></div><div class="helper" style="text-align:left;margin-top:22px">${!aiReady?'This webpage is an offline question guide, not an AI conversation. For questions that truly understand your answers, run the AI version from the Windows launcher. ' : ''}<a href="https://github.com/comctx/Personal-Think-Tank#use-real-ai-on-windows" target="_blank" rel="noopener">How to start real AI</a><div class="small" style="margin-top:6px">${aiStatusHtml()}</div></div></section>`;return}

-top:10px">${weighted(p,o)===null?'Not ranked until every rating is entered':'Weighted score: '+weighted(p,o).toFixed(2)+' / 5'}</div></section>`}return body}

}

document.addEventListener('submit',e=>{const f=e.target;if(f.id==='startForm'){e.preventDefault();return start(f.elements.namedItem('problem').value)}if(f.id==='replyForm'){e.preventDefault();let v=f.elements.namedItem('reply').value;f.reset();return sendReply(v)}if(f.dataset.add){e.preventDefault();return add(f.dataset.add,f.elements.namedItem('item').value)}if(f.id==='whyForm'){e.preventDefault();const p=active();const val=f.elements.namedItem('whyAnswer').value.trim();if(p&&val&&p.whys.length<5){p.whys.push({id:id(),text:val.slice(0,1200)});touch(p);paintDrawer()}return}if(f.id==='taskForm'){e.preventDefault();const p=active(),val=f.elements.namedItem('taskText').value.trim(),due=f.elements.namedItem('taskDue').value;if(p&&val){p.tasks.push({id:id(),text:val,done:false,due:due||''});touch(p);paintDrawer()}return}if(f.id==='optionForm'){e.preventDefault();let val=f.elements.namedItem('option').value.trim();if(val){const p=active();p.options.push({id:id(),name:val,pros:'',cons:'',scores:{}});touch(p);paintDrawer()}return}});
document.addEventListener('input',e=>{const t=e.target,p=active();if(!p)return;if(t.dataset.field){p[t.dataset.field]=t.value;touch(p)}if(t.dataset.decision){p.decision[t.dataset.decision]=t.dataset.decision==='confidence'?Number(t.value):t.value;touch(p)}if(t.dataset.option){let o=p.options.find(x=>x.id===t.dataset.option);if(o){o[t.dataset.prop]=t.value;touch(p)}}});
document.addEventListener('change',e=>{const t=e.target,p=active();if(t.name==='mode'){state.aiPreference=t.value==='ai'?'ai':'guided';state.useAI=t.value==='ai';save();paintDrawer();render();return}if(t.id==='backupFile'){importBackup(t.files?.[0]);t.value='';return}if(!p)return;if(t.dataset.decision){p.decision[t.dataset.decision]=t.dataset.decision==='confidence'?Number(t.value):t.value;touch(p)}if(t.dataset.check){const k=p.tasks.find(x=>x.id===t.dataset.check);if(k){k.done=t.checked;touch(p);paintDrawer()}}if(t.dataset.score){const o=p.options.find(x=>x.id===t.dataset.score);if(o){if(t.value)o.scores[t.dataset.criterion]=Number(t.value);else delete o.scores[t.dataset.criterion];touch(p);paintDrawer()}}});
window.addEventListener('storage',e=>{if(e.key===STORAGE){state=load();render();if(drawerMode)paintDrawer()}});
window.addEventListener('unhandledrejection',e=>{console.error('Personal Think Tank:',e.reason);toast('An action could not finish. Your last response can be retried.');});
render();connectionPromise=checkAI().finally(()=>{connectionPromise=null});
})();
</script>
